# Steps for the GitHub Actions job that deploys the FMS policy stack. Paste them after
# the step that configures AWS credentials. Commit fms_cfn_guard.py and fms_deploy.py
# to the repo side by side (here: scripts/).
#
# fms_deploy.py first lists changes made outside CloudFormation in any live policy
# (and whether this template keeps or reverts each one), then creates the change set
# and prints what changes inside each policy. If an FMS policy would be deleted or
# replaced, it deletes the change set and fails the job. Otherwise it leaves the change
# set for you to review and execute in the console: without --yes and without a
# terminal it never executes anything itself. Add --strict to fail the job when the
# template would revert console changes.
#
# The role the pipeline uses needs, besides what it has today:
#   fms:GetPolicy, fms:ListPolicies, fms:ListTagsForResource,
#   cloudformation:CreateChangeSet, DescribeChangeSet, DeleteChangeSet, GetTemplate,
#   ListStackResources, DescribeStackResources, ListExports, DescribeStacks

    env:
      STACK_NAME: ims-fms-policies                      # your FMS policy stack
      TEMPLATE: cloudformation/ims-fms-policies.yml      # the template in the repo

    steps:
      # ... checkout and AWS credentials steps as today ...

      - name: Install Python packages
        run: pip install --quiet boto3 pyyaml

      # If you keep your CloudFormation drift step: FMS policies always come back
      # NOT_CHECKED there. That is expected; fail only on MODIFIED or DELETED.

      - name: Manual changes, then create and check the change set (execute it in the console)
        run: >
          python3 scripts/fms_deploy.py --stack-name "$STACK_NAME" --template "$TEMPLATE"
          --change-set-name "fms-${{ github.run_id }}"
