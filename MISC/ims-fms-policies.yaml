# -----------------------------------------------------------------------------------------
# AWS Firewall Manager policies for IMS CloudFront distributions (FMS admin account).
# Source: CloudFormation IaC generator output, reformatted for Git. Resource names, logical
# IDs and every setting are unchanged; only the layout of ManagedServiceData differs.
#
# Accounts: tst = 762649987860 | ppe = 097357356161 | prd = 584477831165
#
# Editing ManagedServiceData
#   - It is JSON inside a single-quoted YAML string: '{ ... }'. YAML joins the lines with
#     spaces, so Firewall Manager still receives one line of JSON (max 30,000 characters).
#   - Keep it valid JSON: double quotes, commas between items, no trailing commas.
#   - A single quote inside the JSON must be written twice: ''
#   - No blank lines inside the block (a blank line becomes a real line break).
#   - Don't switch this field to a | block: that sends real line breaks to the FMS API.
#   - Don't rename the FMSPolicy* logical IDs: CloudFormation would treat the renamed one
#     as a new policy (the old one is kept by DeletionPolicy: Retain, so you'd get two).
# -----------------------------------------------------------------------------------------
