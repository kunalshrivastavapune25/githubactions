name: Set up CFN pipeline tooling
description: Installs Python 3.12 and the pipeline's Python dependencies (with pip caching).

inputs:
  extra-packages:
    description: Extra pip packages to install, space separated (e.g. "cfn-lint" or "checkov").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: .github/cfn-pipeline/requirements.txt

    - name: Install Python packages
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        python -m pip install --disable-pip-version-check --quiet --upgrade -r .github/cfn-pipeline/requirements.txt
        if [[ -n "$EXTRA_PACKAGES" ]]; then
          read -r -a extra <<< "$EXTRA_PACKAGES"
          python -m pip install --disable-pip-version-check --quiet --upgrade "${extra[@]}"
        fi
