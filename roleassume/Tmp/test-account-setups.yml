name: Test account setups

# Tests every account in the CloudFormation pipeline's dropdown (47) without deploying anything:
#   GitHub OIDC -> iamr-<account>-<env>-<role> in IMS Root (390403857119) -> the same-named role in the account
#   (Root-IMS: one hop with iamr-plat-prd-deploy), exactly as latest_cft_deployment.yml signs in.
# Then, as that role: the identity is right, the CloudFormation calls the pipeline makes work (list stacks, check a
# template), and an EC2 dry-run write test (deploy roles can write, read roles cannot). Nothing is created.
# One job per account and role, then a Report job with one table and what to fix.
# Run it from the same repo as the pipeline (plat-eng/AWS-Landing-Zone): the prd network roles only accept that repo
# and ims-app/ims-app-identity. Roles: 47 deploy + 46 read (Root-IMS has only its deploy role).

on:
  workflow_dispatch:
    inputs:
      ou:
        description: Which accounts to test
        type: choice
        default: All
        options:
          - All
          - Infrastructure
          - Security
          - Sandbox
          - Root
          - Workload
      roles:
        description: "Which roles: deploy (what the pipeline uses), read, or both"
        type: choice
        default: both
        options:
          - both
          - deploy
          - read
      region:
        description: Region for the CloudFormation and EC2 checks
        type: choice
        default: eu-west-1
        options:
          - eu-west-1
          - us-east-1

permissions:
  id-token: write
  contents: read

env:
  IMS_ROOT_ACCOUNT: "390403857119"
  REGION: ${{ inputs.region }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: 🗂️ Pick accounts
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - name: Pick accounts
        id: pick
        env:
          OU: ${{ inputs.ou }}
          ROLES: ${{ inputs.roles }}
        run: |
          targets=$(jq -c --arg ou "$OU" --arg roles "$ROLES" \
            '[.[] | select(($ou == "All" or .ou == $ou) and ($roles == "both" or .access == $roles))]' <<'JSON'
          [
            {"label": "Infrastructure-PRD-BackupServices", "ou": "Infrastructure", "id": "117837574201", "role": "iamr-backup-prd-deploy", "access": "deploy", "hops": "2", "rootstack": "ims-root-iam-roles-infrastructure", "stack": "ims-prd-backup-ims-backup", "note": ""},
            {"label": "Infrastructure-PRD-BackupServices", "ou": "Infrastructure", "id": "117837574201", "role": "iamr-backup-prd-read", "access": "read", "hops": "2", "rootstack": "ims-root-iam-roles-infrastructure", "stack": "ims-prd-backup-ims-backup", "note": ""},
            {"label": "Infrastructure-PRD-DirectoryServices", "ou": "Infrastructure", "id": "502818572771", "role": "iamr-directory-prd-deploy", "access": "deploy", "hops": "2", "rootstack": "ims-root-iam-roles-infrastructure", "stack": "ims-prd-directory-ims-directory", "note": ""},
