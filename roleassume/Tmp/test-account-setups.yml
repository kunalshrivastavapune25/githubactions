          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.target.label }} · ${{ matrix.target.access }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      LABEL: ${{ matrix.target.label }}
      ACCOUNT_ID: ${{ matrix.target.id }}
      ROLE_NAME: ${{ matrix.target.role }}
      ACCESS: ${{ matrix.target.access }}
    steps:
      - name: "Hop 1: GitHub to IMS Root"
        id: hop1
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.IMS_ROOT_ACCOUNT }}:role/${{ matrix.target.role }}
          role-session-name: test-${{ github.run_id }}
          aws-region: ${{ env.REGION }}

      - name: Check hop 1
        id: check1
        run: |
          arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "Signed in as $arn"
          if [[ "$arn" != "arn:aws:sts::${IMS_ROOT_ACCOUNT}:assumed-role/${ROLE_NAME}/"* ]]; then
            echo "::error title=Wrong identity::Hop 1 signed in as $arn, expected $ROLE_NAME in IMS Root ($IMS_ROOT_ACCOUNT)"
            exit 1
          fi

      - name: "Hop 2: IMS Root to the account"
        id: hop2
        if: matrix.target.hops == '2'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-chaining: true
          role-to-assume: arn:aws:iam::${{ matrix.target.id }}:role/${{ matrix.target.role }}
          role-session-name: test-${{ github.run_id }}
          role-duration-seconds: 3600
          role-skip-session-tagging: true   # the iamr roles' trust policies don't allow sts:TagSession
          aws-region: ${{ env.REGION }}

      - name: Check hop 2
        id: check2
        if: matrix.target.hops == '2'
        run: |
          arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "Signed in as $arn"
          if [[ "$arn" != "arn:aws:sts::${ACCOUNT_ID}:assumed-role/${ROLE_NAME}/"* ]]; then
            echo "::error title=Wrong identity::Hop 2 signed in as $arn, expected $ROLE_NAME in $ACCOUNT_ID"
            exit 1
          fi

      - name: CloudFormation check
        id: cfn
        run: |
          # The calls the deploy pipeline makes before it changes anything – nothing is created.
          aws cloudformation list-stacks --max-items 1 --output json > /dev/null
          echo "✔ Can read the stacks in $ACCOUNT_ID ($REGION)"
          if [ "$ACCESS" = deploy ]; then
            aws cloudformation get-template-summary --output json \
              --template-body '{"Resources": {"Probe": {"Type": "AWS::SNS::Topic"}}}' > /dev/null
            echo "✔ Can check a template (the pipeline's first CloudFormation call)"
          fi

      - name: Write test (dry run, nothing is created)
        id: write
        run: |
          out=$(aws ec2 create-key-pair --key-name "setup-test-${GITHUB_RUN_ID}" --dry-run 2>&1) || true
          echo "$out"
          case "$out" in
            *DryRunOperation*) can_write=yes ;;
            *UnauthorizedOperation*) can_write=no ;;
            *) echo "::error title=Unexpected answer::EC2 answered something else (shown above)"; exit 1 ;;
          esac
          if [ "$ACCESS" = deploy ] && [ "$can_write" = no ]; then
            if grep -q "service control policy" <<< "$out"; then
              echo "::warning title=Guardrail::$ROLE_NAME signed in, but a service control policy blocks ec2:CreateKeyPair in $ACCOUNT_ID. The role works; that guardrail is separate."
            else
              echo "::error title=Cannot write::$ROLE_NAME cannot write: it should have AdministratorAccess"
              exit 1
            fi
          elif [ "$ACCESS" = read ] && [ "$can_write" = yes ]; then
            echo "::error title=Can write::$ROLE_NAME can write: it should only have ReadOnlyAccess"
            exit 1
          fi
          echo "✔ $ROLE_NAME in $ACCOUNT_ID: can write = $can_write (as expected for a $ACCESS role)"

      - name: What to fix
        if: failure()
        env:
          HOP1: ${{ steps.hop1.outcome }}
          CHECK1: ${{ steps.check1.outcome }}
          HOP2: ${{ steps.hop2.outcome }}
          CHECK2: ${{ steps.check2.outcome }}
          CFN: ${{ steps.cfn.outcome }}
          ROOT_STACK: ${{ matrix.target.rootstack }}
          ACCOUNT_STACK: ${{ matrix.target.stack }}
          NOTE: ${{ matrix.target.note }}
        run: |
          if [ "$HOP1" = failure ]; then
            msg="IMS Root role $ROLE_NAME refused this repo or does not exist - check $ROOT_STACK"
          elif [ "$CHECK1" = failure ] || [ "$CHECK2" = failure ]; then
            msg="Signed in, but not as $ROLE_NAME in the expected account - check the role names and account IDs"
          elif [ "$HOP2" = failure ]; then
            msg="$ROLE_NAME is missing in $ACCOUNT_ID or does not trust IMS Root - deploy or check stack $ACCOUNT_STACK"
          elif [ "$CFN" = failure ]; then
            msg="$ROLE_NAME cannot call CloudFormation in $REGION - check the guardrails (SCPs) for that region"
          else
            msg="The write test did not give the expected answer - see the step above"
          fi
          if [ -n "$NOTE" ]; then msg="$msg. Note: $NOTE"; fi
          echo "::error title=$LABEL ($ACCESS)::$msg"

  report:
    name: 📋 Report
    needs: [plan, test]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read     # to read this run's job results
      contents: read
    steps:
      - name: One table for all accounts
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          # This run's jobs and their steps, 100 per page
          : > "$RUNNER_TEMP/pages.json"
          page=1
          while :; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100&page=$page" \
              > "$RUNNER_TEMP/page.json"
            cat "$RUNNER_TEMP/page.json" >> "$RUNNER_TEMP/pages.json"
            [ "$(jq '.jobs | length' "$RUNNER_TEMP/page.json")" -lt 100 ] && break
            page=$((page + 1))
          done
          jq -s '{jobs: map(.jobs[])}' "$RUNNER_TEMP/pages.json" > "$RUNNER_TEMP/jobs.json"
          jq -r --argjson targets "$TARGETS" --arg region "$REGION" '
            def icon: if . == "success" then "✅" elif . == "failure" then "❌" elif . == "skipped" then "⏭️"
                      elif . == null then "—" else "⚠️ \(.)" end;
            .jobs as $jobs
            | ($targets | map(. as $t
                | ([$jobs[] | select(.name == "\($t.label) · \($t.access)")] | .[0]) as $j
                | ($j.steps // [] | map({key: .name, value: .conclusion}) | from_entries) as $s
                | (if $s["Hop 1: GitHub to IMS Root"] == "failure" then "IMS Root role refused this repo or does not exist - check \($t.rootstack)"
                   elif $s["Check hop 1"] == "failure" or $s["Check hop 2"] == "failure" then "signed in as the wrong role or account"
                   elif $s["Hop 2: IMS Root to the account"] == "failure" then "role missing in \($t.id) or not trusting IMS Root - deploy or check \($t.stack)"
                   elif $s["CloudFormation check"] == "failure" then "cannot call CloudFormation in \($region) - check the guardrails"
                   elif $s["Write test (dry run, nothing is created)"] == "failure" then
                     (if $t.access == "deploy" then "deploy role cannot write - should be AdministratorAccess" else "read role can write - should be ReadOnlyAccess" end)
                   elif $j == null then "job not found in this run"
                   else "" end) as $fix
                | {t: $t, j: $j, s: $s,
                   fix: (if $fix != "" and $t.note != "" then "\($fix). \($t.note)" else $fix end)})) as $rows
            | ($rows | map(select(.j.conclusion == "success")) | length) as $ok
            | "### 📋 Account setup test – \($ok) of \($rows | length) passed (region \($region), nothing deployed)",
              "",
              "| Account | Role | Hop 1 (IMS Root) | Hop 2 (account) | CloudFormation | Write test | Result | What to fix |",
              "|---|---|---|---|---|---|---|---|",
              ($rows[] | "| \(.t.label) · `\(.t.id)` | `\(.t.role)` | \(.s["Hop 1: GitHub to IMS Root"] | icon) | "
                + (if .t.hops == "1" then "— (one hop)" else (.s["Hop 2: IMS Root to the account"] | icon) end)
                + " | \(.s["CloudFormation check"] | icon) | \(.s["Write test (dry run, nothing is created)"] | icon) | "
                + (if .j == null then "⚠️ not found" else "[\(.j.conclusion | icon)](\(.j.html_url))" end)
                + " | \(.fix) |")
          ' "$RUNNER_TEMP/jobs.json" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          head -1 "$RUNNER_TEMP/report.md"
          grep '❌' "$RUNNER_TEMP/report.md" | sed 's/^/  /' || echo "  No failures."
