AWSTemplateFormatVersion: "2010-09-09"
Description: IMS Root - GitHub OIDC roles (deploy and read) for the Infrastructure OU accounts

# Hop 1 of the GitHub -> AWS sign-in for the Infrastructure OU accounts:
#   GitHub OIDC -> iamr-<account>-<env>-<deploy|read> here in IMS Root (390403857119)
#               -> the same-named role in the account
# Each role here can only assume the same-named role in its one account; it has no other permissions.
# Same trust (13 GitHub organisations) and policy pattern as the roles in iam-roles-template.yml.
#
# Accounts in this stack:
#   prd  Shared_Services         356666487118  -> iamr-shared-prd-deploy / -read
#   prd  Restore_Services        899867382346  -> iamr-restore-prd-deploy / -read
#   prd  Monitoring_Services     116355921084  -> iamr-monitoring-prd-deploy / -read
#   prd  IMS Directory Services  794035561643  -> iamr-imsdirectory-prd-deploy / -read
#   prd  Security_Infra          119810927880  -> iamr-secinfra-prd-deploy / -read
#   prd  Directory_Services      502818572771  -> iamr-directory-prd-deploy / -read
#   prd  Backup_Services         117837574201  -> iamr-backup-prd-deploy / -read
#   ppe  Shared_Services         050916357979  -> iamr-shared-ppe-deploy / -read
#   ppe  Monitoring_Services     277352717275  -> iamr-monitoring-ppe-deploy / -read
#   ppe  Directory_Services      575210791269  -> iamr-directory-ppe-deploy / -read
#   dev  Directory_Services      119328599021  -> iamr-directory-dev-deploy / -read
#   dev  Shared_Services         697858908364  -> iamr-shared-dev-deploy / -read
#
# Not in this stack: the three Network_Services accounts. Their IMS Root roles iamr-net-prd/ppe/tst-deploy
# and -read already exist in the main stack (iam-roles-template.yml); adding them here would fail
# because the role names are taken. The prd network roles there accept only two repos.
#
# Deploy in:    IMS Root / management account 390403857119, as its own stack (ims-root-iam-roles-infrastructure).
#               IAM role names are unique per account, so none of these roles may also be in another stack.
# Deploy order: 1) this stack   2) each account's iamr-roles template.
#               The account roles' trust policies name these roles, and IAM rejects a trust policy that
#               names a role that does not exist yet ("Invalid principal in policy").
# Parameters:   params.json in cloudformation/ims-root/iam-roles-infrastructure/

Parameters:
  GitHubAudience:
    Type: String
    Default: "sts.amazonaws.com"
    Description: Audience for GitHub OIDC tokens
  managementaccountid:
    Type: String
    Description: Management AWS Account ID (IMS Root)
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: must be a 12-digit AWS account ID
  prdsharedaccid:
    Type: String
    Description: Production Shared_Services AWS Account ID
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: must be a 12-digit AWS account ID
  prdrestoreaccid:
