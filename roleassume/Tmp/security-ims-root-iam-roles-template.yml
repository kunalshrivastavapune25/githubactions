                  - !Sub "repo:${GithubOwner7}/*"
                  - !Sub "repo:${GithubOwner7}@*"
                  - !Sub "repo:${GithubOwner8}/*"
                  - !Sub "repo:${GithubOwner8}@*"
                  - !Sub "repo:${GithubOwner9}/*"
                  - !Sub "repo:${GithubOwner9}@*"
                  - !Sub "repo:${GithubOwner10}/*"
                  - !Sub "repo:${GithubOwner10}@*"
                  - !Sub "repo:${GithubOwner11}/*"
                  - !Sub "repo:${GithubOwner11}@*"
                  - !Sub "repo:${GithubOwner12}/*"
                  - !Sub "repo:${GithubOwner12}@*"
                  - !Sub "repo:${GithubOwner13}/*"
                  - !Sub "repo:${GithubOwner13}@*"
      Policies:
        - PolicyName: assume-audit-prd-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sts:AssumeRole"
                  - "sts:TagSession"
                  - "sts:GetCallerIdentity"
                Resource: !Sub "arn:aws:iam::${prdauditaccid}:role/iamr-audit-prd-read"

