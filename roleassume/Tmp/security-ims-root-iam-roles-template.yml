                  - !Sub "repo:${GithubOwner1}/*"
                  - !Sub "repo:${GithubOwner1}@*"
                  - !Sub "repo:${GithubOwner2}/*"
                  - !Sub "repo:${GithubOwner2}@*"
                  - !Sub "repo:${GithubOwner3}/*"
                  - !Sub "repo:${GithubOwner3}@*"
                  - !Sub "repo:${GithubOwner4}/*"
