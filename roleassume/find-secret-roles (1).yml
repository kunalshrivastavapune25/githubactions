# Find the roles in the secrets
#
# Shows which AWS account and which role each role secret of the old pipelines points to.
#
# Why this is needed: GitHub never shows a secret's value again. Not in Settings, and in run logs it prints ***.
# But it only hides the WHOLE value. This workflow splits each role ARN
#   arn:aws:iam::<account number>:role/<role name>
# and prints the two parts separately, so you can read them. Anything that is not a role ARN is not printed.
# It does not sign in to AWS and changes nothing.
#
# How to use it:
#   1. In the repo where latest_cft_deployment.yml runs, create a new branch (e.g. find-secret-roles).
#   2. Add this file on that branch as  .github/workflows/find-secret-roles.yml  and commit.
#      The commit starts the run by itself (no need to merge, no Run workflow button needed).
#   3. Actions tab → "Find the roles in the secrets" → open the run → the table is on the Summary page.
#   4. Afterwards delete the branch. Anyone who can see the repo's runs can see the table,
#      so also delete the run if the account numbers shouldn't stay there.

name: Find the roles in the secrets

on:
  push:
    paths:
      - .github/workflows/find-secret-roles.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  roles:
    name: 🔍 Roles in the secrets
    runs-on: ubuntu-latest
    env:
      # Every role secret used by latest_cft_deployment.yml, validate-trust-store.yaml and the Route 53 pipelines
      NETWORK_SERVICES_ROLE: ${{ secrets.NETWORK_SERVICES_ROLE }}
      PPE_NETWORK_SERVICE_ROLE: ${{ secrets.PPE_NETWORK_SERVICE_ROLE }}
      TST_NETWORK_SERVICE_ROLE: ${{ secrets.TST_NETWORK_SERVICE_ROLE }}
      DIRECTORY_SERVICES_ROLE: ${{ secrets.DIRECTORY_SERVICES_ROLE }}
      DIRECTORY_SERVICES_DEV_ROLE: ${{ secrets.DIRECTORY_SERVICES_DEV_ROLE }}
      DIRECTORY_SERVICES_PPE_ROLE: ${{ secrets.DIRECTORY_SERVICES_PPE_ROLE }}
      SECURITY_INFRA_ROLE: ${{ secrets.SECURITY_INFRA_ROLE }}
      SHAREDSERVICES_ROLE: ${{ secrets.SHAREDSERVICES_ROLE }}
      DEV_SHAREDSERVICES_ROLE: ${{ secrets.DEV_SHAREDSERVICES_ROLE }}
      PPE_SHARED_SERVICE_ROLE: ${{ secrets.PPE_SHARED_SERVICE_ROLE }}
      MGMT_ROLE: ${{ secrets.MGMT_ROLE }}
      LOGARCHIVE_ROLE: ${{ secrets.LOGARCHIVE_ROLE }}
      COREAUDIT_ROLE: ${{ secrets.COREAUDIT_ROLE }}
      MONITORING_ROLE: ${{ secrets.MONITORING_ROLE }}
      PPE_MONITORING_SERVICE_ROLE: ${{ secrets.PPE_MONITORING_SERVICE_ROLE }}
      BACKUP_ROLE: ${{ secrets.BACKUP_ROLE }}
      CRV_ROLE: ${{ secrets.CRV_ROLE }}
      SANDBOX_ROLE: ${{ secrets.SANDBOX_ROLE }}
      S3_ACCESS_GITHUB_ROLE: ${{ secrets.S3_ACCESS_GITHUB_ROLE }}
    steps:
      - name: Show the account and role in each secret
        run: |
          # secret name, then the roleAlias that uses it (as in the old pipelines' "Set role from alias" step)
          list="
          NETWORK_SERVICES_ROLE        NETWORK
          PPE_NETWORK_SERVICE_ROLE     PPE-NETWORK
          TST_NETWORK_SERVICE_ROLE     TST-NETWORK
          DIRECTORY_SERVICES_ROLE      DIRECTORY
          DIRECTORY_SERVICES_DEV_ROLE  DIRECTORY-DEV
          DIRECTORY_SERVICES_PPE_ROLE  DIRECTORY-PPE
          SECURITY_INFRA_ROLE          SECURITY
          SHAREDSERVICES_ROLE          SHAREDSERVICES
          DEV_SHAREDSERVICES_ROLE      SHAREDSERVICES-DEV
          PPE_SHARED_SERVICE_ROLE      SHAREDSERVICES-PPE
          MGMT_ROLE                    MANAGEMENT
          LOGARCHIVE_ROLE              LOGARCHIVE
          COREAUDIT_ROLE               COREAUDIT
          MONITORING_ROLE              MONITORING
          PPE_MONITORING_SERVICE_ROLE  MONITORING-PPE
          BACKUP_ROLE                  BACKUP
          CRV_ROLE                     CRV
          SANDBOX_ROLE                 SANDBOX
          S3_ACCESS_GITHUB_ROLE        (large templates: S3 upload)
          "

          # Accounts we already know from iam-roles-template.yml and its params
          account_label() {
            case "$1" in
              390403857119) echo " (IMS Root)" ;;
              584477831165) echo " (network prd)" ;;
              097357356161) echo " (network ppe)" ;;
              762649987860) echo " (network tst)" ;;
              *) echo "" ;;
            esac
          }

          role_arn='^arn:aws[a-z-]*:iam::([0-9]{12}):role/([A-Za-z0-9+=,.@_/-]+)$'
          total=0; master=0
          {
            echo "## Roles in the secrets"
            echo
            echo "| roleAlias | Secret | Account | Role name |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          while read -r secret alias; do
            [ -n "$secret" ] || continue
            total=$((total + 1))
            value=$(printf '%s' "${!secret}" | tr -d '[:space:]')
            if [ -z "$value" ]; then
              account="not set"; role="–"
            elif [[ $value =~ $role_arn ]]; then
              account="${BASH_REMATCH[1]}$(account_label "${BASH_REMATCH[1]}")"
              role=${BASH_REMATCH[2]}
              if [ "$role" = AWSControlTowerExecution ]; then master=$((master + 1)); fi
            else
              account="set, but not a role ARN (not shown)"; role="–"
            fi
            printf '%-20s %-28s %-36s %s\n' "$alias" "$secret" "$account" "$role"
            if [ "$role" = "–" ]; then cell="–"; else cell="\`$role\`"; fi
            echo "| $alias | \`$secret\` | $account | $cell |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$list"

          {
            echo
            echo "**$master of $total** secrets point to Control Tower's master key, \`AWSControlTowerExecution\`."
          } >> "$GITHUB_STEP_SUMMARY"
