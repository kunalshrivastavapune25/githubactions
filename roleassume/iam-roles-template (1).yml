    Description: Test Fin AWS Account ID
  tstsecaccid:
    Type: String
    Description: Test Sec AWS Account ID
  tstnwaccid:
    Type: String
    Description: Test Network AWS Account ID

  ppecollaccid:
    Type: String
    Description: PPE Coll AWS Account ID
  ppecommaccid:
    Type: String
    Description: PPE Comm AWS Account ID
  ppecustaccid:
    Type: String
    Description: PPE Cust AWS Account ID
  ppeintaccid:
