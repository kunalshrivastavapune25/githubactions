                  - !Sub "repo:${GithubOwner12}@*"
                  - !Sub "repo:${GithubOwner13}/*"
                  - !Sub "repo:${GithubOwner13}@*"
      Policies:
        - PolicyName: assume-coll-prd-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sts:AssumeRole"
                  - "sts:TagSession"
                  - "sts:GetCallerIdentity"
                Resource: !Sub "arn:aws:iam::${prdcollaccid}:role/iamr-coll-prd-deploy"
