Resources:
  PRDCollDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: iamr-coll-prd-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${managementaccountid}:oidc-provider/token.actions.tescoims.ghe.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                token.actions.tescoims.ghe.com:aud: !Ref GitHubAudience
              StringLike:
                token.actions.tescoims.ghe.com:sub:
                  - !Sub "repo:${GithubOwner1}/*"
                  - !Sub "repo:${GithubOwner1}@*"
                  - !Sub "repo:${GithubOwner2}/*"
                  - !Sub "repo:${GithubOwner2}@*"
