AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role in management account for GitHub OIDC federated access

Parameters:
  # GithubRepo:
  #   Type: String
  #   Description: GitHub repository name
  # GithubBranch:
  #   Type: String
  #   Default: "main"
  #   Description: GitHub branch name
  GitHubAudience:
    Type: String
    Default: "sts.amazonaws.com"
    Description: Audience for GitHub OIDC tokens
  managementaccountid:
    Type: String
    Description: Management AWS Account ID
  prdcollaccid:
    Type: String
    Description: Production Coll AWS Account ID
  prdcommaccid:
    Type: String
    Description: Production Comm AWS Account ID
  prdcustaccid:
    Type: String
