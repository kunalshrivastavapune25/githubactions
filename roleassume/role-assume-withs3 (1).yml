name: Deploy CFT with IAM Role and S3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment code (dev, tst, ppe, prd)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - tst
          - ppe
          - prd
      workload:
        description: "Workload code (coll, comm, cust, fin, int, sec, tu)"
        required: true
        default: comm
        type: choice
        options:
          - coll
          - comm
          - cust
          - fin
          - int
          - sec
          - tu
      accessLevel:
        description: "Which IMS role to use"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - read
      folderPath:
        description: "Path under cloudformation/ (e.g. 'vpc' or 'network/peering')"
        required: true
      stackName:
        description: "Name of CloudFormation stack to deploy"
        required: true
      # roleAlias:
      #   description: "Alias for the IAM role to assume (e.g. NETWORK, DIRECTORY)"
      #   required: true

permissions:
  id-token: write
  contents: read

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Find template and params
        id: find_files
        run: |
          base_dir="cloudformation"
          folder="${{ github.event.inputs.folderPath }}"
          full_path="${base_dir}/${folder}"
          template_file=$(find "$full_path" -type f \( -iname "*-template.yaml" -o -iname "*-template.yml" \) | head -n 1)
          params_file="${full_path}/params.json"
          if [[ -z "$template_file" ]]; then
            echo "No template matching '*-template.y[a]ml' found in $full_path"
            exit 1
          fi
          if [[ ! -f "$params_file" ]]; then
            echo "params.json not found in $full_path"
            exit 1
          fi
          echo "template_file=$template_file" >> $GITHUB_OUTPUT
          echo "params_file=$params_file" >> $GITHUB_OUTPUT

      - name: Run cfn-lint
        run: cfn-lint -t ${{ steps.find_files.outputs.template_file }}
        continue-on-error: true
  deploy:
    runs-on: ubuntu-latest
    needs: Lint
    env:
      BUCKET_NAME: ss-cfts3
      AWS_REGION: eu-west-1
      ROOT_ACCOUNT_ID: "390403857119"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      # - name: Set role ARN from alias
      #   id: setrole
      #   run: |
      #     alias="${{ github.event.inputs.roleAlias }}"
      #     case "$alias" in
      #       NETWORK) arn="${{ secrets.NETWORK_SERVICES_ROLE }}" ;;
      #       DIRECTORY) arn="${{ secrets.DIRECTORY_SERVICES_ROLE }}" ;;
      #       SECURITY) arn="${{ secrets.SECURITY_INFRA_ROLE }}" ;;
      #       SHAREDSERVICES) arn="${{ secrets.SHAREDSERVICES_ROLE }}" ;;
      #       MANAGEMENT) arn="${{ secrets.MGMT_ROLE }}" ;;
      #       LOGARCHIVE) arn="${{ secrets.LOGARCHIVE_ROLE }}" ;;
      #       MONITORING) arn="${{ secrets.MONITORING_ROLE }}" ;;
      #       DIRECTORY-DEV) arn="${{ secrets.DIRECTORY_SERVICES_DEV_ROLE }}" ;;
      #       DEV-COLL) arn="${{ secrets.DEV_COLL_ROLE }}" ;;
      #       PROD-COLL) arn="${{ secrets.PROD_COLL_ROLE }}" ;;
      #       PROD-COMM) arn="${{ secrets.PROD_COMM_ROLE }}" ;;
      #       PROD-CUST) arn="${{ secrets.PROD_CUST_ROLE }}" ;;
      #       PROD-FIN) arn="${{ secrets.PROD_FIN_ROLE }}" ;;
      #       PROD-INT) arn="${{ secrets.PROD_INT_ROLE }}" ;;
      #       PROD-SEC) arn="${{ secrets.PROD_SEC_ROLE }}" ;;
      #       PROD-TU) arn="${{ secrets.PROD_TU_ROLE }}" ;;
      #       TST-TU) arn="${{ secrets.TST_TU_ROLE }}" ;;
